<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Monuments | Gallery</title>
  <meta name="description" content="Browse monument thumbnails in a responsive grid and open individual detail pages for history and facts.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">⟡</span>
        <span class="brand-name">World Monuments</span>
      </a>
      <div class="header-actions">
        <nav class="site-nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="about.html">About</a>
        <a href="feedback.html">Feedback</a>
        <a href="sitemap.html">Sitemap</a>
      </nav>
        <button id="darkModeBtn" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to light mode">Light mode</button>
      </div>
    </div>
  </header>

  <main class="container">
    <h1>Monument Gallery</h1>

    <section class="lead">
      <p>Select a monument to open its dedicated page with a short history, key facts, and a link back here.</p>
    </section>

    <section class="gallery-grid" aria-label="Monument thumbnails">
      
      <article class="card gallery-item">
        <a class="gallery-link" href="monument-1.html">
          <figure>
            <img src="images/Giza-thumb.jpg" alt="Illustration thumbnail of the Great Pyramid of Giza" loading="lazy">
            <figcaption>Great Pyramid of Giza</figcaption>
          </figure>
        </a>
      </article>
    
      <article class="card gallery-item">
        <a class="gallery-link" href="monument-2.html">
          <figure>
            <img src="images/colosseum-thumb.jpeg" alt="Illustration thumbnail of the Roman Colosseum" loading="lazy">
            <figcaption>Colosseum</figcaption>
          </figure>
        </a>
      </article>
    
      <article class="card gallery-item">
        <a class="gallery-link" href="monument-3.html">
          <figure>
            <img src="images/taj mahal-thumb.jpeg" alt="Illustration thumbnail of the Taj Mahal" loading="lazy">
            <figcaption>Taj Mahal</figcaption>
          </figure>
        </a>
      </article>
    
      <article class="card gallery-item">
        <a class="gallery-link" href="monument-4.html">
          <figure>
            <img src="images/eifle-thumb.jpg" alt="Illustration thumbnail of the Eiffel Tower" loading="lazy">
            <figcaption>Eiffel Tower</figcaption>
          </figure>
        </a>
      </article>
    
      <article class="card gallery-item">
        <a class="gallery-link" href="monument-5.html">
          <figure>
            <img src="images/machu picchu-thumb.jpeg" alt="Illustration thumbnail of Machu Picchu terraces" loading="lazy">
            <figcaption>Machu Picchu</figcaption>
          </figure>
        </a>
      </article>
    
      <article class="card gallery-item">
        <a class="gallery-link" href="monument-6.html">
          <figure>
            <img src="images/petra al khazneh-thumb.jpeg" alt="Illustration thumbnail of Petra's Treasury façade" loading="lazy">
            <figcaption>Petra (Al-Khazneh)</figcaption>
          </figure>
        </a>
      </article>
    
    </section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>World Monuments</p>
    </div>
  </footer>
  <script src="js/main.js" defer></script>
</body>
</html>
